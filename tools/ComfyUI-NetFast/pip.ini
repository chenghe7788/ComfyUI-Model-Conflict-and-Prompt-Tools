[global]
; Aliyun first: verified reachable from this machine.  Tsinghua and Tencent are
; kept as extra indexes for redundancy (pip queries all of them and picks the
; best version; a blocked one just fails fast).
index-url = https://mirrors.aliyun.com/pypi/simple/
extra-index-url = https://pypi.tuna.tsinghua.edu.cn/simple
                  https://mirrors.cloud.tencent.com/pypi/simple/
timeout = 30
retries = 3
